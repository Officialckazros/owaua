<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · owaua</title>
  <style>
    :root { color-scheme:light; --paper:#efede7; --surface:#fff; --ink:#111; --muted:#5e5e5a; --line:#c8c6bf; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,720px); padding:clamp(28px,7vw,64px); border:1px solid var(--ink); background:var(--surface); }
    .mark { width:42px; height:8px; margin-bottom:42px; border:1px solid var(--ink); border-right-width:20px; }
    p { color:var(--muted); }
    .eyebrow { color:#73736f; font:700 .7rem/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0 0 14px; font-size:clamp(2.8rem,9vw,6rem); line-height:.98; letter-spacing:-.07em; }
    a { color:inherit; text-underline-offset:4px; }
    a.button { display:inline-block; margin-top:16px; padding:11px 15px; border:1px solid var(--ink); background:var(--ink); color:#fff; text-decoration:none; font-weight:750; }
    a.button:hover, a.button:focus-visible { background:#fff; color:var(--ink); }
    :focus-visible { outline:2px solid currentColor; outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <p class="eyebrow">404 / not here</p>
    <h1>wrong corner.</h1>
    <p>That page does not exist on owaua. Head back to the guide or open the server dashboard.</p>
    <a class="button" href="/">Back to owaua</a>
    <a href="/partnerships">Partnerships</a>
    <a href="/dashboard">Dashboard</a>
  </main>
</body>
</html>
