[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "owaua"
version = "2.0.0"
description = "Privacy-first Discord assistant and companion desktop pet"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "LicenseRef-Obsidian-1.0"
keywords = ["discord", "discord-bot", "moderation", "privacy", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiohttp>=3.11,<4.0",
  "anthropic>=0.40.0",
  "audioop-lts>=0.2.1; python_version >= '3.13'",
  "ddgs>=6.0.0",
  "discord.py>=2.3,<3.0",
  "groq>=0.11.0",
  "httpx>=0.27,<1.0",
  "langdetect>=1.0.9",
  "PyNaCl>=1.6.2,<2.0",
  "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Officialckazros/owaua"
Repository = "https://github.com/Officialckazros/owaua"
Issues = "https://github.com/Officialckazros/owaua/issues"
Security = "https://github.com/Officialckazros/owaua/security/policy"

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pyright==1.1.411",
  "ruff==0.16.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  ".wrangler",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"desktoppet/tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
