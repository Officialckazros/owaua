name: Release owaua

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows
            output: owaua-Windows.exe
          - os: macos-15-intel
            label: macOS
            output: owaua-macOS.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Pin reproducible build environment
        shell: bash
        run: |
          epoch="$(git log -1 --format=%ct)"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes -r desktoppet/requirements.lock

      - name: Build Windows application
        if: runner.os == 'Windows'
        working-directory: desktoppet
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name owaua --add-data "desktoppet.jpg;." pet.py
          Copy-Item dist\owaua.exe owaua-Windows.exe

      - name: Sign Windows application when configured
        if: runner.os == 'Windows' && env.SIGNING_CERTIFICATE != ''
        working-directory: desktoppet
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "owaua-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw "signtool.exe was not found" }
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $certificate /p $env:SIGNING_PASSWORD owaua-Windows.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool.exe failed" }
            & $signTool.FullName verify /pa /v owaua-Windows.exe
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed" }
          } finally {
            Remove-Item $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: Build macOS application
        if: runner.os == 'macOS'
        working-directory: desktoppet
        run: python -m PyInstaller --noconfirm --clean --windowed --name owaua --add-data "desktoppet.jpg:." pet.py

      - name: Normalize unsigned macOS bundle timestamps
        if: runner.os == 'macOS'
        working-directory: desktoppet
        run: >-
          python -c "import os, pathlib;
          root = pathlib.Path('dist/owaua.app'); epoch = int(os.environ['SOURCE_DATE_EPOCH']);
          paths = sorted(root.rglob('*'), key=lambda path: len(path.parts), reverse=True);
          [os.utime(path, (epoch, epoch), follow_symlinks=False) for path in paths];
          os.utime(root, (epoch, epoch))"

      - name: Sign and notarize macOS application when configured
        if: >-
          runner.os == 'macOS' &&
          env.SIGNING_CERTIFICATE != '' &&
          env.SIGNING_IDENTITY != '' &&
          env.APPLE_ID != '' &&
          env.APPLE_TEAM_ID != '' &&
          env.APPLE_APP_PASSWORD != ''
        working-directory: desktoppet
        env:
          SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          CERTIFICATE_PATH: ${{ runner.temp }}/owaua-signing.p12
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/owaua-signing.keychain-db"
          certificate="$RUNNER_TEMP/owaua-signing.p12"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate" "$RUNNER_TEMP/owaua-notarize.zip"' EXIT
          python -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["SIGNING_CERTIFICATE"], validate=True))'
          security create-keychain -p temporary "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p temporary "$keychain"
          security import "$certificate" -P "$SIGNING_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary "$keychain"
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" dist/owaua.app
          ditto -c -k --keepParent dist/owaua.app "$RUNNER_TEMP/owaua-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/owaua-notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/owaua.app
          codesign --verify --deep --strict --verbose=2 dist/owaua.app
          xcrun stapler validate dist/owaua.app

      - name: Package macOS application
        if: runner.os == 'macOS'
        working-directory: desktoppet
        run: ditto -c -k --keepParent dist/owaua.app owaua-macOS.zip

      - name: Record signing status
        working-directory: desktoppet
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MACOS_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          SIGNING_REPORT: SIGNING-${{ matrix.label }}.txt
        run: >-
          python -c "import os, pathlib, platform;
          signed = bool(os.getenv('WINDOWS_CERTIFICATE')) if platform.system() == 'Windows'
          else all(os.getenv(k) for k in ('MACOS_CERTIFICATE','MACOS_IDENTITY','APPLE_ID','APPLE_TEAM_ID','APPLE_APP_PASSWORD'));
          pathlib.Path(os.environ['SIGNING_REPORT']).write_text('Platform: ' + platform.system() + '\nSigned and notarized where applicable: ' + ('yes' if signed else 'no (unsigned build)') + '\n', encoding='utf-8')"

      - name: Generate dependency SBOM
        working-directory: desktoppet
        env:
          SBOM_FILE: owaua-${{ matrix.label }}.cdx.json
        run: |
          python -m pip install cyclonedx-bom==7.3.1
          python -c "import os, subprocess; subprocess.run(['cyclonedx-py','requirements','requirements.lock','--output-reproducible','--of','JSON','-o',os.environ['SBOM_FILE']], check=True)"

      - name: Generate SHA-256 checksums
        working-directory: desktoppet
        env:
          RELEASE_FILE: ${{ matrix.output }}
          SBOM_FILE: owaua-${{ matrix.label }}.cdx.json
          SIGNING_REPORT: SIGNING-${{ matrix.label }}.txt
          CHECKSUM_FILE: owaua-${{ matrix.label }}-SHA256SUMS.txt
        run: >-
          python -c "import hashlib, os, pathlib;
          paths = [pathlib.Path(os.environ[name]) for name in ('RELEASE_FILE','SBOM_FILE','SIGNING_REPORT')];
          lines = [hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n' for path in sorted(paths)];
          pathlib.Path(os.environ['CHECKSUM_FILE']).write_text(''.join(lines), encoding='ascii')"

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owaua-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktoppet/${{ matrix.output }}
            desktoppet/owaua-${{ matrix.label }}.cdx.json
            desktoppet/owaua-${{ matrix.label }}-SHA256SUMS.txt
            desktoppet/SIGNING-${{ matrix.label }}.txt

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required only to create or update the tagged GitHub release.
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
          fi
