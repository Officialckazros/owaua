name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install bot and quality dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install ruff==0.16.3 mypy==2.3.1 pyright==1.1.411 pip-audit==2.10.1

      - name: Compile source
        run: python -m compileall -q src desktoppet/pet.py scripts/deploy

      - name: Run unit tests
        env:
          DISCORD_TOKEN: test-token
          PYTHONPATH: src
          OWAUA_DB: ${{ runner.temp }}/owaua-tests.db
          OWAUA_OWNER_ID: ""
          OWAUA_PRIVACY_CONTACT: privacy@example.invalid
          OWAUA_RULES_ENABLED: "0"
          OWAUA_RULES_GUILD: ""
          OWAUA_RULES_LLM_ENABLED: "0"
          OWAUA_SAFETY_ENABLED: "0"
          OWAUA_STT_ENABLED: "0"
          OWAUA_SYNC_COMMANDS: "0"
          OWAUA_LOAD_DOTENV: "0"
        run: python -m unittest discover -s tests -v

      - name: Run deterministic AI control-plane evals
        env:
          DISCORD_TOKEN: eval-token
          PYTHONPATH: src
          OWAUA_LOAD_DOTENV: "0"
        run: python scripts/run_ai_evals.py

      - name: Check generated slash-command reference
        env:
          DISCORD_TOKEN: documentation-token
          PYTHONPATH: src
          OWAUA_LOAD_DOTENV: "0"
        run: python scripts/generate_slash_reference.py --check

      - name: Validate deployment manifest without remote access
        run: python scripts/deploy owaua --dry-run

      - name: Lint repository
        if: matrix.python-version == '3.12'
        run: ruff check src tests desktoppet/pet.py desktoppet/tests

      - name: Type-check public web service
        if: matrix.python-version == '3.12'
        run: mypy --ignore-missing-imports --follow-imports=skip src/owaua/web.py

      - name: Type-check all Python code
        if: matrix.python-version == '3.12'
        run: pyright src scripts tests --pythonpath "$(command -v python)"

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        run: pip-audit --local --skip-editable --progress-spinner off

  desktop:
    name: Desktop headless smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktoppet/requirements.lock

      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Install desktop and audit dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes -r desktoppet/requirements.lock
          python -m pip install pyright==1.1.411 pip-audit==2.10.1

      - name: Run desktop tests without a display server
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s desktoppet/tests -v

      - name: Type-check desktop Python code
        run: pyright desktoppet --pythonpath "$(command -v python)"

      - name: Audit desktop dependencies
        run: pip-audit --local --skip-editable --progress-spinner off

  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check and test Worker
        working-directory: cloudflare-worker
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run check
          npm test
          npm run dry-run

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
